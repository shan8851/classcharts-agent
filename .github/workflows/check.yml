name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Oldest supported (first with type stripping on by default) and current.
        node: ["22.18", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: ./bin/classcharts --help
      - run: node dist/cli.js --version
      - name: Clear error without a login
        run: |
          set +e
          CLASSCHARTS_EMAIL= node dist/cli.js digest; code=$?
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }
